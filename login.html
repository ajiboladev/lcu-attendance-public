<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | LCU Attendance</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/style.css?v=4"><link rel="modulepreload" href="js/core.js"><link rel="modulepreload" href="js/login.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js"></head><body><div id="boot"><div class="spin"></div></div><header><img src="assets/logo.png" alt="Lead City University logo"><b>LCU Attendance</b></header><main><div class="card" id="box"><h1>Student login</h1><div class="alert ok" id="flash" hidden></div><form id="form" novalidate><label>Email<input name="email" type="email" autocomplete="email" maxlength="100"></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="64"></label><div class="alert" role="alert" hidden></div><button id="go" type="submit">Log in</button><button id="forgot" type="button" class="ghost">Forgot password?</button></form><div class="links">New here? <a href="signup.html" id="toSignup">Create an account</a></div><dialog id="recovery"><h2>Finish your account setup</h2><p class="muted">Your account was created but setup did not finish. Fill in your details to complete it on this device.</p><form id="rform" novalidate><div id="rfields"></div><div class="alert" role="alert" hidden></div><button id="rgo" type="submit">Complete setup</button><button id="rcancel" type="button" class="ghost">Cancel</button></form></dialog></div></main><script type="module" src="js/login.js"></script></body></html>
